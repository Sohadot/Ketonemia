name: Verify governance invariants

# Ketonemia.com is a governed reference asset: its route lists, structured
# data, machine-readable JSON, classification rules, internal link graph, and
# FAQ structured data must stay coherent with one another. This workflow runs
# scripts/verify_governance.py on every change so those invariants are enforced
# automatically instead of by hand, and a regression blocks the merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify governance invariants
        run: python3 scripts/verify_governance.py

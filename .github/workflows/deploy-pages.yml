name: Deploy static site to GitHub Pages

# Ketonemia.com is a static HTML site served from the repository root.
# It is intentionally NOT a Jekyll site: there is no _config.yml, no Gemfile,
# and no .scss. This workflow publishes the files as-is, with no Jekyll build,
# which avoids the jekyll-theme-primer / style.scss conversion error produced
# by the default "pages build and deployment" builder.
#
# Requirement: in the repository, set Settings -> Pages -> Build and deployment
# -> Source to "GitHub Actions" for this workflow to publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (repository root, served verbatim)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
